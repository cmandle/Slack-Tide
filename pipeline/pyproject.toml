[project]
name = "slacktide"
version = "0.1.0"
description = "Ingestion pipeline for the Slack Tide community events platform"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "icalendar>=5.0",
  "feedparser>=6.0",
  "rapidfuzz>=3.0",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slacktide = "slacktide.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slacktide*"]

[tool.setuptools.package-data]
slacktide = ["*.yaml", "site_assets/*", "site_assets/icons/*"]

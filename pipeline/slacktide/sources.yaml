- id: submissions
  name: Submitted through slack-tide.org
  kind: sheet
  url: ""
  town: ""
  role: primary
  enabled: false
  provenance: Verified organizer
  # The public form at /add/ posts to a Google Form; its responses land in a Google Sheet that
  # is published to the web as CSV (File, Share, Publish to web, the responses tab, CSV). Put
  # that CSV address in `url` above and enable the source. `form.action` is the Google Form's
  # formResponse address and `form.fields` maps our field names to its entry ids (open the
  # form's prefilled-link tool to read them). Until `form.action` is set, /add/ opens the
  # visitor's email client with the details filled in instead.
  form:
    action: ""
    fields:
      title: ""
      date: ""
      start: ""
      end: ""
      venue: ""
      town: ""
      kind: ""        # Events | Community groups & meetups | Volunteer opportunities
      category: ""    # one of config.CATEGORIES, or blank for "you choose"
      url: ""
      cost: ""
      description: ""
      name: ""
      email: ""
  note: Decision 12. Nothing from this source publishes without the approver; review stays "person".

- id: new-bedford-light
  name: The New Bedford Light
  kind: rss
  url: https://newbedfordlight.org/feed/
  town: New Bedford
  role: primary
  enabled: false
  note: Articles, not events. Stored for a later extraction pass, not published directly.

# ---- Decision 13 (2026-11-08): the named list. Organisations and groups the editors asked for first.

- id: aha-new-bedford
  name: AHA! New Bedford
  kind: tribe
  url: https://ahanewbedford.org/wp-json/tribe/events/v1/events
  town: New Bedford
  role: primary
  enabled: false
  provenance: Posted by the organisation
  default_category: Arts & Theatre
  note: >-
    Decision 13. On 2026-10-25 the plugin held three 2022 test events; on 2026-11-08 it answers
    with 28, still titled "Tested" and "December Test" but already carrying the second-Thursday
    After Dark pattern at 11 William Street. AHA is setting it up; the editors chose not to wait,
    so the next-AHA page below is read instead. Enable this when the plugin carries real titles,
    and retire aha-next-aha then.

- id: aha-next-aha
  name: AHA! New Bedford, the next AHA! Night
  kind: html
  url: https://ahanewbedford.org/next-aha/
  town: New Bedford
  role: primary
  provenance: Posted by the organisation
  default_category: Arts & Theatre
  select:
    item: "article.elementor-post"
    title: ".elementor-widget-theme-post-title .elementor-heading-title"
    venue: ".elementor-widget-text-editor:not(:-soup-contains('Ends:')) .elementor-widget-container"
    end: ".elementor-widget-text-editor:-soup-contains('Ends:')"
    description: ".elementor-widget-theme-post-content .elementor-widget-container"
    page_when: "h2.elementor-heading-title, h3.elementor-heading-title"   # "november 12th, 2026"
    when_class: "tag-"                                                     # tag-200pm on the card
    start: "17:00"                                                         # AHA! Night opens at 5
  note: >-
    Decision 13. One Elementor post loop per AHA! Night: a card per activity with the title, a
    venue line with the street address, the description and "Ends: 8:00pm". The card has no
    date; the night's date is in the page headings and the start time is a WordPress tag on the
    card (tag-200pm). 33 cards on 2026-11-08, 29 with content. Rebuilt by AHA each month, so the
    series ids change monthly except for standing activities; the AHA! Night umbrella itself is
    declared on standing-new-bedford.

- id: cisco-live-music
  name: Cisco Brewers Kitchen & Bar, live music
  kind: html
  url: https://www.ciscokitchenbar.com/live-music/
  town: New Bedford
  venue: Cisco Brewers Kitchen & Bar
  role: primary
  provenance: Posted by the venue
  default_category: Music
  select:
    item: "section.c-one-col--text:has(> h2:-soup-contains('Live Music')) p:has(> strong)"
    group_next: 1                 # the date paragraph plus the artist paragraph after it
    title: "p:nth-of-type(2)"     # "Day Drinkers 6pm"; the trailing time is dropped
    when: "p"                     # "Thursday, November 5" + "Day Drinkers 6pm"
  note: >-
    Decision 13. BentoBox page written as pairs of paragraphs, a bold date then "artist time",
    under an "Indoor Live Music" heading; artist bios follow in a second section. 11 shows for
    November on 2026-11-08. Was a 404 on 2026-10-25. The weekly happenings (brunch, chef
    nights) are declared on standing-new-bedford.

- id: south-coast-places-for-people
  name: South Coast Places for People
  kind: ical
  url: https://api.lu.ma/ics/get?entity=calendar&id=cal-1cKC6jMQ8Hatgih
  town: New Bedford
  role: primary
  provenance: Posted by the organisation
  default_category: Civic & Town Meetings
  note: >-
    Decision 13. Housing, transport and public-space advocacy group: monthly meetups at the
    Co-Creative Center, walk audits, talks. Publishes on Luma (luma.com/southcoastplacesforpeople);
    every Luma calendar has this public iCal feed. 28 events on 2026-11-08, one of them upcoming;
    the LOCATION line carries the street address, which the iCal connector splits.

- id: standing-new-bedford
  name: Standing schedules, New Bedford
  kind: recurring
  town: New Bedford
  role: primary
  provenance: Declared from the venue's published schedule
  note: >-
    Decision 13. Weekly and monthly events the venues state in prose with no feed behind them.
    Each entry records where the schedule was seen and when; re-check them each season and remove
    what has stopped. Publication still passes the approver. Categories for games nights are
    provisional until issue 12 settles the taxonomy.
  series:
    - title: Trivia night
      venue: PLAY Arcade
      weekday: wednesday
      start: "19:00"
      end: "21:00"
      url: https://www.playarcadenb.com/
      category: Sports & Recreation
      confirmed: 2026-11-08
      confirmed_at: https://www.playarcadenb.com/   # home page: "Trivia every Wednesday from 7-9PM"
    - title: Karaoke
      venue: PLAY Arcade
      weekday: thursday
      start: "20:00"
      end: "00:00"
      url: https://www.playarcadenb.com/
      category: Music
      confirmed: 2026-11-08
      confirmed_at: https://www.playarcadenb.com/   # home page: "Karaoke every Thursday from 8PM-12AM"
    - title: Trivia night
      venue: New Beige
      weekday: wednesday
      url: https://newbeigema.squarespace.com/
      category: Sports & Recreation
      enabled: false
      # Named by the editor on 2026-11-08. The venue's site (Squarespace, 39 Union Street) has no
      # events page and the only listing found online is Thursday music bingo. Add the start
      # time once confirmed with the venue, then set enabled: true.
    - title: AHA! Night
      venue: Downtown New Bedford
      weekday: thursday
      week: 2
      start: "17:00"
      end: "21:00"
      url: https://ahanewbedford.org/
      category: Arts & Theatre
      description: >-
        Free arts and culture night across downtown New Bedford on the second Thursday of every
        month. The month's theme and programme are on ahanewbedford.org.
      confirmed: 2026-11-08
      confirmed_at: https://ahanewbedford.org/next-aha/
    - title: Live Music Beatles Brunch
      venue: Cisco Brewers Kitchen & Bar
      weekday: sunday
      start: "10:00"
      end: "14:00"
      url: https://www.ciscokitchenbar.com/happenings/
      category: Music
      confirmed: 2026-11-08
      confirmed_at: https://www.ciscokitchenbar.com/happenings/   # "every Sunday from 10am-2pm"
    - title: Chef Hiroki tuna carving
      venue: Cisco Brewers Kitchen & Bar
      weekday: tuesday
      week: 1
      url: https://www.ciscokitchenbar.com/happenings/
      category: Food & Drink
      description: A whole sustainably caught tuna carved in front of the room, served as sashimi and poke. Reservations on the venue's page.
      confirmed: 2026-11-08
      confirmed_at: https://www.ciscokitchenbar.com/happenings/   # "First Tuesday of every Month"; no time given
    - title: Chef Hiroki's omakase dinner
      venue: Cisco Brewers Kitchen & Bar
      weekday: tuesday
      week: 3
      url: https://www.ciscokitchenbar.com/happenings/
      category: Food & Drink
      description: A ten to twelve course omakase dinner. Reservations on the venue's page.
      confirmed: 2026-11-08
      confirmed_at: https://www.ciscokitchenbar.com/happenings/   # "Third Tuesday of every Month"; no time given

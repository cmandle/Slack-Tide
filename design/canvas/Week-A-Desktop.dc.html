<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week ahead, option A, cards, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:#1A1A1A;background:#F6F1EE}
a{color:#1A1A1A}a:hover{color:#FF6B6C}
.mono{font-family:'IBM Plex Mono',Menlo,monospace}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100%; background-color: #F6F1EE; background-image: linear-gradient(90deg, transparent 47px, #F3A6A4 47px, #F3A6A4 49px, transparent 49px), linear-gradient(270deg, transparent 47px, #F3A6A4 47px, #F3A6A4 49px, transparent 49px), linear-gradient(#C7D6DE 1px, transparent 1px), linear-gradient(90deg, #C7D6DE 1px, transparent 1px); background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px; background-repeat: no-repeat, no-repeat, repeat, repeat; padding: 28px 64px 32px 64px; display: flex; flex-direction: column">

  <section style="display: flex; flex-direction: column; gap: 14px">
    <h2 class="mono" style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; height: 28px; line-height: 28px; border-bottom: 2px solid #1A1A1A; display: flex; justify-content: space-between"><span>The week ahead</span><span>Oct 26 to Nov 1</span></h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px 16px">
      <sc-for list="{{week}}" as="e" hint-placeholder-count="12">
        <a href="#event" style="display: flex; text-decoration: none; color: #1A1A1A; background: #F6F1EE; border: 1px solid #1A1A1A; min-height: 96px">
          <div style="flex: 0 0 104px; background: #FFEF6B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 6px; text-align: center">
            <span style="font-size: 15px; font-weight: 700; line-height: 1">{{e.day}}</span>
            <span class="mono" style="font-size: 11px; line-height: 1.2">{{e.time}}</span>
          </div>
          <div style="flex: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px">
            <span style="font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
            <span class="mono" style="font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.where}}</span>
            <span style="display: flex; gap: 6px; margin-top: 3px">
              <span class="mono" style="font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border: 1px solid #1A1A1A">{{e.town}}</span>
            </span>
          </div>
          <span class="mono" style="flex: 0 0 28px; background: {{e.color}}; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase">{{e.cat}}</span>
        </a>
      </sc-for>
    </div>

    <a href="#month" class="mono" style="align-self: flex-start; font-size: 12px; line-height: 28px">See the whole month →</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const stock = { music: '#FF6B6C', arts: '#86B2CB', outdoors: '#6CCB77', family: '#FFEF6B', library: '#C9A7E3', markets: '#FFA657', civic: '#B8C7D1' };
    const label = k => k[0].toUpperCase() + k.slice(1);
    const week = [
      { day: 'MON 26', time: '9:00 AM', title: 'Women’s walk', where: 'Slocum’s River Reserve', town: 'Dartmouth', k: 'outdoors' },
      { day: 'MON 26', time: '6:30 PM', title: 'Knitting circle', where: 'Wareham Free Library', town: 'Wareham', k: 'library' },
      { day: 'TUE 27', time: '10:30 AM', title: 'Toddler story hour', where: 'Elizabeth Taber Library', town: 'Marion', k: 'library' },
      { day: 'TUE 27', time: '7:00 PM', title: 'Select Board meeting', where: 'Town Hall', town: 'Rochester', k: 'civic' },
      { day: 'WED 28', time: '5:30 PM', title: 'Open studio night', where: 'Hatch Street Studios', town: 'New Bedford', k: 'arts' },
      { day: 'THU 29', time: '7:00 PM', title: 'Songwriters in the round', where: 'Narrows Center for the Arts', town: 'Fall River', k: 'music' },
      { day: 'FRI 30', time: '6:30 PM', title: 'Halloween lantern walk', where: 'Town green', town: 'Marion', k: 'family' },
      { day: 'SAT 31', time: '9:00 AM', title: 'Farmers market', where: 'Town Hall lot', town: 'Wareham', k: 'markets' },
      { day: 'SAT 31', time: '9:00 AM', title: 'Trail stewards work morning', where: 'Destruction Brook Woods', town: 'Dartmouth', k: 'outdoors' },
      { day: 'SAT 31', time: '7:00 PM', title: 'Harvest dance', where: 'Grange hall', town: 'Little Compton', k: 'music' },
      { day: 'SUN NOV 1', time: '8:00 AM', title: 'Harbor walk: winter birds', where: 'Ned’s Point', town: 'Mattapoisett', k: 'outdoors' },
      { day: 'SUN NOV 1', time: '1:00 PM', title: 'Harvest tasting', where: 'Main Street', town: 'Little Compton', k: 'markets' }
    ].map(e => ({ ...e, cat: label(e.k), color: stock[e.k] }));
    return { week };
  }
}
</script>
</body>
</html>

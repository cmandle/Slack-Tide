# Venues: the places behind the map (2026-11-08). One entry per real place. The normaliser
# reads the aliases, so every spelling listed here lands on the one name; the site build reads
# the coordinates, so the place gets a pin. Edited by hand; the pipeline never writes it.
#
# Fields: id, name (the canonical display name; it is hashed into every series id at that
# place, so renaming an entry sends its approved series back through review), town (one of
# config.TOWNS), address (street address for the geocoder and the popup; optional), lat and
# lon (decimal degrees; empty until geocoded), geocoded (census, nominatim or hand, with the
# date), aliases (raw venue strings seen in sources, as they appear), url (optional), note.
#
# Filling in coordinates: python pipeline/tools/geocode_venues.py writes lat and lon into
# every entry that lacks them, from the US Census geocoder for street addresses and from
# OpenStreetMap's Nominatim for named places, both free and keyless. The same tool with
# --missing lists the venue strings in data/events.json that match no entry here: the to-do
# list. A series whose venue matches nothing sits at its town centre (config.TOWN_CENTERS),
# marked approximate.


# Runs the tests and the pipeline twice a day and commits data/. The workflow owns data/;
# nobody commits that folder by hand (see CLAUDE.md). Needs Settings > Actions > General >
# Workflow permissions = "Read and write permissions" in addition to the declaration below.
name: Ingest events

on:
  schedule:
    - cron: "17 10,22 * * *"   # 10:17 and 22:17 UTC, early morning and evening Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline
        run: pip install -e "pipeline[dev]"

      - name: Run the offline tests
        working-directory: pipeline
        run: pytest -q

      - name: Run the pipeline against live sources
        run: slacktide run --no-cache

      - name: Commit data/
        run: |
          git config user.name "slack-tide-bot"
          git config user.email "bot@slack-tide.org"
          git add data/events.json data/run-report.json data/tide.json
          if git diff --cached --quiet; then
            echo "No changes in data/"
            exit 0
          fi
          git commit -m "Ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
